name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: 'ubuntu-latest'
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
        experimental: [ false ]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest --cov
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lowest:
    runs-on: 'ubuntu-latest'
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: lowest
          python-version: "3.11"

      - name: Install the lowest dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  package:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build
        run: uv build --no-sources

      - name: Check the metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel
        run: |
          uv sync --locked --no-install-project --group dev
          uv pip install dist/*.whl

      - name: Run tests against the wheel
        run: |
          uv run --no-sync python -c "import entoscope, pathlib; assert 'site-packages' in pathlib.Path(entoscope.__file__).parts"
          uv run --no-sync pytest

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install coverage
        run: uv sync --only-group dev

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and report
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage report
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          uv run --no-sync coverage html

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/

  docs:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build the docs
        run: uv run --no-sync sphinx-build -W --keep-going docs docs/_build/html

      - name: Upload the docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html/
