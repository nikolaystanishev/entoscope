[project]
name = "intex"
version = "0.1.0"
description = "Mechanistic interpretability toolkit for large language models"
readme = "README.md"
authors = [
    { name = "Nikolay Stanishev", email = "stanishev.nikolay@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jaxtyping>=0.2.37",
    "numpy>=2.1.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pyyaml>=6.0.3",
    "torch>=2.9.0",
    "tqdm>=4.68.3",
    "transformer-lens>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["F722"]  # jaxtyping shape strings, e.g. Int[Tensor, "batch pos"]
