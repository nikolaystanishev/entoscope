[project]
name = "intex"
version = "0.1.0"
description = "Mechanistic interpretability toolkit for large language models"
readme = "README.md"
authors = [
    { name = "Nikolay Stanishev", email = "stanishev.nikolay@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
