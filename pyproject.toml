[project]
name = "entoscope"
version = "0.1.0"
description = "Mechanistic interpretability toolkit for large language models"
readme = "README.md"
# The vendored circuit/vendor/contributions.py is CC BY-NC 4.0; NOTICE beside it gives the details.
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE", "src/entoscope/circuit/vendor/NOTICE"]
authors = [
    { name = "Nikolay Stanishev", email = "stanishev.nikolay@gmail.com" }
]
keywords = [
    "mechanistic interpretability",
    "interpretability",
    "transformer-lens",
    "logit lens",
    "tuned lens",
    "probing",
    "activation patching",
    "circuit discovery",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # transformer-lens and tuned-lens import datasets, and one before 2.14.7 needs pyarrow's PyExtensionType,
    # which current pyarrow no longer has. A floor is needed: 2.14.4, the last datasets with no fsspec cap,
    # is what a resolver lands on whenever the newer ones are ruled out (as on Intel macOS).
    "datasets>=2.14.7",
    "einops>=0.6",
    "jaxtyping>=0.2.37",
    "networkx>=3.4",
    "numpy>=2.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas>=2.3.3",
    "plotly>=5.20",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7",
    "torch>=2.9.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tqdm>=4.68.3",
    "transformer-lens>=3.2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tuned-lens>=0.2.0",
    # TypeVar defaults (PEP 696), which typing has only from Python 3.13.
    "typing-extensions>=4.12",
    # Intel macOS: torch dropped x86_64 wheels after 2.2.2, which caps
    # transformer-lens at 2.15.x (2.16+ needs torch>=2.6) and numpy at <2
    # (torch 2.2 is built against numpy 1.x). Requires Python <=3.12.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformer-lens>=2.15.4,<2.16; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # transformers 5+ needs torch>=2.4 and drops APIs transformer-lens 2.15 uses. Declared here rather
    # than as a uv constraint, so it holds wherever entoscope is installed.
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Documentation = "https://nikolaystanishev.github.io/entoscope/"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs~=2.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.20",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["entoscope"]
branch = true
# Paths stored relative to the checkout, so data from the CI matrix jobs combines on another runner.
relative_files = true
# Vendored third-party code (CC BY-NC 4.0), kept verbatim - its untested lines aren't ours to cover.
omit = ["*/entoscope/circuit/vendor/*"]

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Vendored third-party code (CC BY-NC 4.0) is kept close to verbatim; don't lint it.
extend-exclude = ["src/entoscope/circuit/vendor"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["F722"]  # jaxtyping shape strings, e.g. Int[Tensor, "batch pos"]
